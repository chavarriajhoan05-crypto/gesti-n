{% extends "base.html" %}

{% block title %}Crear Reporte - Gestión de Mantenimiento{% endblock %}

{% block content %}
<div class="form-page">
    <h2>Crear Nuevo Reporte de Daño</h2>
    
    <form method="POST" class="form-reporte">
        <div class="form-section">
            <h3>Información del Reporte</h3>
            
            <div class="form-group">
                <label for="titulo">Título del Daño *</label>
                <input type="text" id="titulo" name="titulo" class="form-control" required maxlength="200" placeholder="Ej: Puerta rota del piso 2">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción Detallada *</label>
                <textarea id="descripcion" name="descripcion" class="form-control" required rows="5" placeholder="Describe el daño con detalle..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="aula_id">Aula / Espacio *</label>
                    <select id="aula_id" name="aula_id" class="form-control" required>
                        <option value="">Selecciona un aula</option>
                        {% for aula in aulas %}
                            <option value="{{ aula.id }}">{{ aula.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="categoria_id">Categoría *</label>
                    <select id="categoria_id" name="categoria_id" class="form-control" required>
                        <option value="">Selecciona una categoría</option>
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h3>Prioridad y Asignación</h3>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="prioridad">Prioridad *</label>
                    <select id="prioridad" name="prioridad" class="form-control" required>
                        <option value="Media">Media</option>
                        <option value="Baja">Baja</option>
                        <option value="Alta">Alta</option>
                        <option value="Urgente">Urgente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="responsable">Responsable de Reporte *</label>
                    <input type="text" id="responsable" name="responsable" class="form-control" required placeholder="Tu nombre">
                </div>
            </div>

            <div class="form-group">
                <label for="costo_estimado">Costo Estimado (opcional)</label>
                <input type="number" id="costo_estimado" name="costo_estimado" class="form-control" step="0.01" min="0" placeholder="Ej: 1500.00">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Crear Reporte</button>
            <a href="{{ url_for('listar_reportes') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
