<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de Mantenimiento{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h1>🔧 Gestión de Mantenimiento</h1>
            </div>
            <ul class="navbar-menu">
                <li><a href="{{ url_for('index') }}" class="nav-link">Inicio</a></li>
                <li><a href="{{ url_for('listar_reportes') }}" class="nav-link">Reportes</a></li>
                <li><a href="{{ url_for('crear_reporte') }}" class="nav-link btn-crear">+ Nuevo Reporte</a></li>
                <li><a href="{{ url_for('estadisticas') }}" class="nav-link">Estadísticas</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <p>&copy; 2024 Sistema de Gestión de Mantenimiento Institucional. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
